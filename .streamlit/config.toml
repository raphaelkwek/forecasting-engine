[server]
# Deliberately above MAX_UPLOAD_BYTES (25 MB) in
# src/forecasting_engine/ingest/upload.py. If the two matched, Streamlit's own
# generic rejection would fire first and the user would never see our
# size-limit message. Keep this the looser of the two.
maxUploadSize = 30


# A trading-terminal palette — black canvas, a saturated orange accent, gold
# reserved for brand emphasis — deliberately evoking Bloomberg/Reuters-style
# screens, since that is the visual language portfolio and risk managers
# already read fluently. Dark is the default (`base`); a lighter variant is
# still defined for anyone who switches Streamlit's own theme setting.
#
# Semantic colour (green/yellow/red/blue) stays on conventional hues rather
# than orange or gold, on purpose: a "blocking issue" badge must never be
# mistaken for brand decoration.

[theme]
base = "dark"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.dark]
backgroundColor = "#0A0807"
secondaryBackgroundColor = "#171310"
textColor = "#F5EEE1"
primaryColor = "#FF6A00"
linkColor = "#FF8C3D"
borderColor = "#332A1E"
dataframeBorderColor = "#332A1E"
dataframeHeaderBackgroundColor = "#171310"
codeBackgroundColor = "#171310"
codeTextColor = "#F5EEE1"

greenColor = "#2ECC71"
greenTextColor = "#2ECC71"
greenBackgroundColor = "#12261A"
yellowColor = "#FFC94A"
yellowTextColor = "#FFC94A"
yellowBackgroundColor = "#2B2210"
orangeColor = "#FF6A00"
orangeTextColor = "#FF6A00"
orangeBackgroundColor = "#2E1B0D"
redColor = "#FF4D4D"
redTextColor = "#FF4D4D"
redBackgroundColor = "#2E1212"
blueColor = "#4DD8E8"
blueTextColor = "#4DD8E8"
blueBackgroundColor = "#0F2429"
grayColor = "#B8ADA0"
grayTextColor = "#B8ADA0"
grayBackgroundColor = "#171310"

[theme.light]
backgroundColor = "#FFFDF9"
secondaryBackgroundColor = "#FBF3E7"
textColor = "#1C1712"
primaryColor = "#E85D00"
linkColor = "#C94E00"
borderColor = "#E7D9C3"
dataframeBorderColor = "#E7D9C3"
dataframeHeaderBackgroundColor = "#FBF3E7"
codeBackgroundColor = "#FBF3E7"
codeTextColor = "#1C1712"

greenColor = "#1E8449"
greenTextColor = "#1E8449"
