[project]
name = "forecasting-engine"
version = "0.1.0"
description = "Forecasting engine for strategic asset allocation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "duckdb>=1.1",
    "openpyxl>=3.1.5",
    "pandas-market-calendars>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecasting_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Streamlit puts the main script's directory on sys.path, so pages import
# sibling modules by bare name. Mirror that here so tests import them the
# same way the running app does.
pythonpath = ["app"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
